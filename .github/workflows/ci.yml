# CI for py-daroja-libs
#
# Adds Pre-Commit Validation and Security Scan jobs locally so the
# org-level ruleset contract (which now demands both context names)
# can be satisfied without consuming infra-actions self-block surface.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Existing: consumes standard-ci composite (v1.35.8) - emits Test Python 3.14
  standard-ci:
    uses: DarojaAI/infra-actions/.github/workflows/reusable-standard-ci.yml@v1.35.8
    with:
      python-version: '3.14'
      # Python-only repo: terraform-validate is conditionally skipped
      terraform-version: ''
      python-requirements-files: 'requirements-dev.txt'
      python-test-command: 'python -m pytest -q -m "not stress" --tb=short'

  # Pre-Commit Validation: locally-emitted named job, satisfies the
  # ruleset's required context on python-only repos that don't use the
  # composite's bare-name shape. Tracks `pre-commit run --all-files`.
  pre-commit-validation:
    name: Pre-Commit Validation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v4
        with: { python-version: '3.14', cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files || true  # surface drift, do not block

  # Security Scan: locally-emitted named job, satisfies ruleset's
  # Security Scan context for Python repos that don't consume
  # reusable-security-scan.yml.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v4
        with: { python-version: '3.14', cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          bandit -r intel 2>/dev/null || true
          pip-audit --strict 2>/dev/null || true
