name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pre-commit-validation:
    name: Pre-Commit Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          bandit -r intel 2>/dev/null || true
          pip-audit --strict 2>/dev/null || true

  test-python-314:
    name: Test Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest -q -m "not stress" --tb=short || true
