name: py-daroja-libs stress tests

# Issues #7/#8: real-PG stress test for the asyncpg
# concurrent-cancellation segfault pattern. Catches regressions in
# the DatabaseManager sync facade that the mock-based unit tests
# cannot (mock tests stub asyncpg at the pool level; the C code is
# never loaded, so the bug class is invisible).
#
# Issue #29: parametrized against both backends (asyncpg + psycopg 3).
# Two jobs run the same stress test against two different drivers
# and both must pass for the workflow to be green.
#
# Triggers (issue #987 trim, 2026-08-07):
#   - pull_request on daroja-coding-agent/* branches: minimal variant
#     (8-task burst) runs on every PR this agent opens against
#     py-daroja-libs. Cheap regression net without burning nightly
#     compute.
#   - weekly Sunday 06:00 UTC: full minimal variant on both backends.
#     Catches asyncpg upgrades, pool refactors, or backend changes
#     that don't go through a PR.
#   - workflow_dispatch: full minimal variant on both backends. The
#     50-task "heavy" variant is gated behind the manual `stress-heavy`
#     job below — use it before tagging a release if you want
#     extra confidence, but it adds ~10s to the run for low marginal
#     value (the bug was reproducible at N=2, not N=50).

on:
  pull_request:
    branches:
      - main
    paths:
      - "common/db/**"
      - "tests/stress/**"
      - ".github/workflows/py-daroja-libs-stress.yml"
  schedule:
    - cron: "0 6 * * 0"  # weekly Sunday (was daily; trimmed 2026-08-07)
  workflow_dispatch:
    inputs:
      heavy:
        description: "Run the 50-task heavy stress variant on both backends"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  stress-asyncpg:
    name: Stress test (asyncpg)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stress -d stress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND: asyncpg

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install asyncpg

      - name: Run minimal concurrent-cancellation stress test (asyncpg)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: stress
          POSTGRES_SCHEMA: public
        run: |
          # The minimal variant (8 tasks, 4 cancelled) is the actual
          # regression check — the original bug was reproducible at
          # N=2, not N=50. The 50-task "heavy" variant runs only via
          # the `stress-heavy` job below (manual trigger).
          #
          # `-k "asyncpg and minimal"` selects only the minimal
          # asyncpg parametrization. The full asyncpg parametrization
          # (50 tasks) is excluded by the "minimal" filter.
          python -m pytest tests/stress/ -v --tb=short -k "asyncpg and minimal"

  stress-psycopg3:
    name: Stress test (psycopg 3)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stress -d stress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND: psycopg3

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install "psycopg[binary,pool]"

      - name: Run minimal concurrent-cancellation stress test (psycopg 3)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: stress
          POSTGRES_SCHEMA: public
        run: |
          python -m pytest tests/stress/ -v --tb=short -k "psycopg3 and minimal"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-logs
          path: |
            .pytest_cache/
            **/__pycache__/
          if-no-files-found: ignore

  # Heavy stress variant. Manual-only (`workflow_dispatch` with input
  # `heavy=true`); runs the full 50-task burst on both backends.
  # Not on schedule — the minimal variant is enough regression
  # coverage. Use this before tagging a release if you want extra
  # confidence in the cancellation path under load.
  stress-heavy:
    name: Stress test (heavy — manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.heavy == 'true'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stress -d stress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        backend: [asyncpg, psycopg3]

    env:
      BACKEND: ${{ matrix.backend }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          if [ "$BACKEND" = "asyncpg" ]; then
            pip install asyncpg
          else
            pip install "psycopg[binary,pool]"
          fi

      - name: Run heavy concurrent-cancellation stress test
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: stress
          POSTGRES_PASSWORD: stress
          POSTGRES_DB: stress
          POSTGRES_SCHEMA: public
          STRESS_N: "50"
          STRESS_CANCEL_FRACTION: "0.5"
          STRESS_CANCEL_DELAY: "0.1"
          STRESS_QUERY_DELAY: "0.5"
        run: |
          # Full 50-task burst on ${{ matrix.backend }}. Runs the
          # non-minimal variant (`-k "not minimal"`) so the heavy
          # burst is what gets exercised.
          python -m pytest tests/stress/ -v --tb=short -k "${{ matrix.backend }} and not minimal"
